name: Build OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sft1200-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  BUILDER_URL: https://github.com/201821143044/gl-infra-builder-new.git
  BUILDER_COMMIT: bcf28a4224d1f3345e65d22272c8c198b24bb5ab
  OPENWRT_DIR: ${{ github.workspace }}/builder/openwrt-18.06/siflower/openwrt-18.06
  LOG_DIR: ${{ github.workspace }}/build-logs

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          exec > >(tee "$LOG_DIR/environment.log") 2>&1
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler \
            file flex g++-multilib gawk gcc-multilib gettext git gperf \
            help2man intltool libelf-dev libglib2.0-dev libgmp-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libreadline-dev libssl-dev libtool lzma ninja-build patch \
            perl pkgconf python2.7 python3 python3-dev python3-pyelftools \
            python3-setuptools python3-yaml rsync sharutils subversion \
            swig texinfo time unzip wget xsltproc xxd xz-utils \
            zlib1g-dev zstd
          sudo apt-get clean
          git config --global user.name 'SFT1200 Build'
          git config --global user.email 'sft1200-build@localhost'
          git rev-parse HEAD > "$LOG_DIR/repository-commit.txt"
          df -h

      - name: Prepare SFT1200 SDK
        run: |
          set -euo pipefail
          exec > >(tee "$LOG_DIR/sdk.log") 2>&1
          git init builder
          git -C builder remote add origin "$BUILDER_URL"
          git -C builder fetch --depth 1 origin "$BUILDER_COMMIT"
          git -C builder checkout --detach FETCH_HEAD
          git -C builder rev-parse HEAD > "$LOG_DIR/builder-commit.txt"
          cd builder
          python3 setup.py -c configs/config-siflower-18.x.yml
          cd "$OPENWRT_DIR"
          # Pin the moving vendor feed BEFORE gen_config.py installs packages.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import yaml

          profile_path = Path('profiles/target_siflower_gl-sft1200.yml')
          original = profile_path.read_text()
          profile = yaml.safe_load(original)
          common = [f for f in profile['feeds'] if f['name'] == 'gl_feed_common']
          assert len(common) == 1, 'Expected exactly one gl_feed_common entry'
          assert common[0]['uri'] == 'https://github.com/gl-inet/gl-feeds.git'
          common[0].pop('branch', None)
          common[0]['revision'] = '99b45c5e0d791a017267888b907d9e1dacdeb9c5'
          Path(os.environ['LOG_DIR'], 'sft1200-profile-original.yml').write_text(original)
          profile_path.write_text(yaml.safe_dump(profile, sort_keys=False))

          # This builder fork has no feeds/glinet directory. Use SDK LuCI feeds.
          luci_path = Path('profiles/luci.yml')
          luci = yaml.safe_load(luci_path.read_text())
          assert luci.get('feeds') == [{'name': 'glinet', 'path': '../feeds_dir/glinet'}]
          luci['feeds'] = []
          luci_path.write_text(yaml.safe_dump(luci, sort_keys=False))
          print('Pinned gl_feed_common to SDK-era revision:', common[0]['revision'])

          # The SDK downloads QCA99X0 board data even when its package is disabled.
          # Register this download only for builds selecting a QCA99X0 package.
          qca_path = Path('package/firmware/linux-firmware/qca_ath10k.mk')
          qca_text = qca_path.read_text()
          download_rule = '$(eval $(call Download,qca99x0-board))'
          assert qca_text.count(download_rule) == 1, 'Unexpected QCA99X0 download rule'
          guarded_rule = (
              'ifneq ($(filter y m,$(CONFIG_PACKAGE_ath10k-firmware-qca99x0) '
              '$(CONFIG_PACKAGE_ath10k-firmware-qca99x0-ct)),)\n'
              + download_rule + '\nendif'
          )
          qca_path.write_text(qca_text.replace(download_rule, guarded_rule, 1))
          Path(os.environ['LOG_DIR'], 'qca_ath10k-patched.mk').write_text(qca_path.read_text())
          print('QCA99X0 board download now depends on package selection.')
          PY
          python3 scripts/gen_config.py target_siflower_gl-sft1200 luci
          test -f Makefile

      - name: Configure feeds
        run: |
          set -euo pipefail
          exec > >(tee "$LOG_DIR/feeds.log") 2>&1
          cd "$OPENWRT_DIR"
          if [ -f "$GITHUB_WORKSPACE/feeds.conf.default" ]; then
            cp "$GITHUB_WORKSPACE/feeds.conf.default" feeds.conf.default
          fi
          bash -e "$GITHUB_WORKSPACE/diy-part1.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply firmware configuration
        run: |
          set -euo pipefail
          exec > >(tee "$LOG_DIR/configuration.log") 2>&1
          cd "$OPENWRT_DIR"
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p files
            cp -a "$GITHUB_WORKSPACE/files/." files/
          fi
          cp "$GITHUB_WORKSPACE/.config" .config
          bash -e "$GITHUB_WORKSPACE/diy-part2.sh"
          make defconfig
          for option in \
            CONFIG_TARGET_siflower_sf19a28_fullmask_SF19A28-GL-SFT1200 \
            CONFIG_PACKAGE_ua2f \
            CONFIG_PACKAGE_kmod-rkp-ipid; do
            if ! grep -qx "${option}=y" .config; then
              echo "::error::Required option missing: ${option}=y. Finish the firmware customization before building."
              exit 1
            fi
          done
          cp .config "$LOG_DIR/build.config"
          ./scripts/diffconfig.sh > "$LOG_DIR/diffconfig.txt"
          cp feeds.conf.default "$LOG_DIR/feeds.conf.default"

      - name: Download source packages
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR"
          make download -j8 V=s 2>&1 | tee "$LOG_DIR/download.log"

      - name: Compile firmware
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR"
          if ! make -j"$(nproc)" V=s 2>&1 | tee "$LOG_DIR/build.log"; then
            echo 'Parallel build failed; retrying with one job for a clearer error.'
            make -j1 V=s 2>&1 | tee "$LOG_DIR/build-single-job.log"
          fi

      - name: Check firmware output
        run: |
          set -euo pipefail
          cd "$OPENWRT_DIR/bin/targets"
          find . -type f \( -name '*.tar' -o -name '*.img' -o -name '*.bin' \) \
            -print > "$LOG_DIR/firmware-files.txt"
          test -s "$LOG_DIR/firmware-files.txt"
          find . -type f \( -name '*.tar' -o -name '*.img' -o -name '*.bin' \) \
            -print0 | sort -z | xargs -0 -r sha256sum > "$LOG_DIR/firmware-sha256.txt"
          cp "$LOG_DIR/firmware-sha256.txt" SFT1200-Lab-sha256.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: SFT1200-firmware-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.OPENWRT_DIR }}/bin/targets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p "$LOG_DIR"
          df -h > "$LOG_DIR/disk-space.txt"
          if [ -f "$OPENWRT_DIR/.config" ]; then
            cp "$OPENWRT_DIR/.config" "$LOG_DIR/build.config"
          fi
          if [ -d "$OPENWRT_DIR/logs" ]; then
            cp -a "$OPENWRT_DIR/logs" "$LOG_DIR/openwrt-logs"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SFT1200-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.LOG_DIR }}/
          if-no-files-found: warn
          retention-days: 14
